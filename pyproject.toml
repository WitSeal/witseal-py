[project]
name = "witseal"
version = "0.1.1"
description = "WitSeal Python SDK: consume, verify, and inspect witnessed-execution evidence (receipts and evidence packages)"
readme = "README.md"
authors = [
    { name = "WitSeal contributors", email = "noreply@witseal.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["witseal", "witnessed-execution", "evidence-chain", "execution-receipt", "verifier", "sdk", "agentic-trust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "rfc8785>=0.1.4",
    "cryptography>=42",
]

[project.optional-dependencies]
# Optional MCP protocol surface (witseal.integrations.mcp). The base package
# stays minimal: the verify-only core (verify_witseal_artifact) needs nothing
# beyond the runtime deps above; only the MCP *tool/server* surface needs the
# SDK, so it lives behind this extra. Install with `pip install witseal[mcp]`.
mcp = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://witseal.com"
Repository = "https://github.com/WitSeal/witseal-py"
"Bug Tracker" = "https://github.com/WitSeal/witseal-py/issues"
Changelog = "https://github.com/WitSeal/witseal-py/blob/main/CHANGELOG.md"
"TypeScript reference" = "https://github.com/WitSeal/witseal"
"Rust reference" = "https://github.com/WitSeal/witseal-rs"

[project.scripts]
witseal-py = "witseal.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.7",
    # Installed in dev/CI so the tests under tests/integrations/ exercise the
    # MCP protocol surface (the `mcp` extra). It is NOT a runtime dependency —
    # the verify-only core works without it (see [project.optional-dependencies]).
    "mcp>=1.0",
]
# Conformance oracle: jcs is Anders Rundgren's reference implementation (RFC 8785
# co-author). Used by tests/test_canonical_json_vectors.py to guard against future
# rfc8785 regressions. Not a runtime dependency.
canonicalize-oracle = [
    "jcs>=0.2.1",
]

[tool.uv]
package = true
# Ensure the canonicalize-oracle group (jcs) is installed on default `uv sync` so
# tests/test_canonical_json_vectors.py — the rfc8785-vs-jcs parity guard — can
# run as part of the default CI gate.
default-groups = ["dev", "canonicalize-oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/witseal"]

# The `mcp` SDK is an OPTIONAL extra (witseal.integrations.mcp imports it
# lazily / under TYPE_CHECKING only). When it is installed — as it is in CI's
# dev group — mypy uses its real, py.typed types and checks our usage fully.
# This override only keeps the type gate from hard-failing on a base-only
# checkout where the extra is absent; it does not relax checking of our code.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]

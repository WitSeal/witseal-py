# Sanitary barrier — CI gate for this repository.
#
# Fails any push/PR to main that introduces Cyrillic (U+0400-U+04FF), a local
# filesystem path, or an internal marker. The internal-marker patterns are
# supplied out-of-band through the SANITARY_DENYLIST repository secret, so this
# public workflow does not enumerate them; when that secret is unset the
# internal-marker class is skipped while the Cyrillic and local-path gates
# still run. The workflow file is excluded from its own scans.
name: Sanitary barrier
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  sanitary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No Cyrillic in tracked files
        run: |
          set -euo pipefail
          if git ls-files -z \
            | grep -zZv '^\.github/workflows/sanitary-barrier\.yml$' \
            | xargs -0 grep -lIP '[\x{0400}-\x{04FF}]' 2>/dev/null; then
            echo "::error::Cyrillic found in tracked files (see paths above)"
            exit 1
          fi
          echo "No Cyrillic. OK."
      - name: No local filesystem paths
        run: |
          set -euo pipefail
          if git ls-files -z \
            | grep -zZv '^\.github/workflows/sanitary-barrier\.yml$' \
            | xargs -0 grep -lIE '/(Users|home)/[A-Za-z0-9._-]+' 2>/dev/null; then
            echo "::error::Local filesystem path found in tracked files (see paths above)"
            exit 1
          fi
          echo "No local paths. OK."
      - name: Internal-marker denylist (out-of-band pattern)
        env:
          DENYLIST: ${{ secrets.SANITARY_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST:-}" ]; then
            echo "::notice::SANITARY_DENYLIST not set; internal-marker scan skipped (Cyrillic + path gates still enforced)."
            exit 0
          fi
          if git ls-files -z \
            | grep -zZv '^\.github/workflows/sanitary-barrier\.yml$' \
            | xargs -0 grep -lIE "${DENYLIST}" 2>/dev/null; then
            echo "::error::Internal marker found in tracked files (see paths above)"
            exit 1
          fi
          echo "No internal markers. OK."

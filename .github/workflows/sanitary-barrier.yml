# Sanitary barrier — CI gate for the witseal-py repository.
#
# PREPARED (NOT ACTIVE). Activation = merge as
# `.github/workflows/sanitary-barrier.yml` into witseal-py AFTER its
# sanitation rewrite (force-push: coordination/ removed, paths/cyrillic
# cleaned), so the barrier stands on clean history. Anchored to public sanitation note.
#
# Fails any PR/push to main introducing Cyrillic (U+0400–U+04FF) or a
# denylist marker (internal paths/roles/artifacts/telemetry). In particular
# blocks re-introduction of a coordination/ tree or operational telemetry.
# Also blocks internal provenance citations: `[redacted]`, `[redacted]`,
# `[redacted]` (the noun — NOT `ratified`, which stays for public RFC-002
# revision metadata, e.g. "RFC-002 §7 rev2 ratified <date>").
# By-design NOT flagged: public ADR-NNNN, IETF RFC 8785, product RFC-001/002.
# Self-excludes this workflow file from its own denylist scan.
name: Sanitary barrier
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  sanitary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Cyrillic in tracked files
        run: |
          set -euo pipefail
          if git ls-files -z \
            | grep -zZv '^\.github/workflows/sanitary-barrier\.yml$' \
            | xargs -0 grep -lIP '[\x{0400}-\x{04FF}]' 2>/dev/null; then
            echo "::error::Cyrillic found in tracked files (see paths above)"
            exit 1
          fi
          echo "No Cyrillic. OK."
      - name: No coordination/ telemetry tree
        run: |
          set -euo pipefail
          if git ls-files -z 'coordination/*' | grep -qz .; then
            echo "::error::coordination/ telemetry must not exist in this repo"
            exit 1
          fi
          echo "No coordination/ tree. OK."
      - name: Denylist (internal paths / roles / artifacts)
        run: |
          set -euo pipefail
          PAT='[redacted]|[redacted]|\b[redacted]\b|\b[redacted]\b|[redacted]|[redacted]|[redacted]|[redacted]|[redacted]|deferred tools|[redacted]|[redacted]|[redacted]'
          if git ls-files -z \
            | grep -zZv '^\.github/workflows/sanitary-barrier\.yml$' \
            | xargs -0 grep -lIE "$PAT" 2>/dev/null; then
            echo "::error::Denylist marker found in tracked files (see paths above)"
            exit 1
          fi
          echo "No denylist markers. OK."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly canary: re-run the suite and the dependency audit against the
    # latest compatible dependencies even when nothing has been committed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Coverage (3.13 only)
        if: matrix.python-version == '3.13'
        run: uv run pytest --cov=witseal --cov-report=term-missing

  quality:
    name: Lint, types, vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Vocabulary discipline
        run: uv run python scripts/style_check.py
      - name: Version consistency
        run: uv run python scripts/check_version_consistency.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: pip-audit (runtime + dev dependencies)
        run: uv run --with pip-audit pip-audit

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check artifacts
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

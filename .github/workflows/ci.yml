name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Recheck the committed lock and current advisories every week.
    # dependency-canary.yml separately resolves newer allowed versions.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Require the MCP API included in this test environment
        run: uv run --locked python -c "from mcp.server.fastmcp import FastMCP"
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Coverage (3.13 only)
        if: matrix.python-version == '3.13'
        run: uv run --locked pytest --cov=witseal --cov-report=term-missing

  quality:
    name: Lint, types, vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Mypy (strict)
        run: uv run --locked mypy src
      - name: Vocabulary discipline
        run: uv run --locked python scripts/style_check.py
      - name: Version consistency
        run: uv run --locked python scripts/check_version_consistency.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: pip-audit (runtime + dev dependencies)
        run: |
          uv --version
          uv run --locked --with pip-audit pip-audit --version
          uv run --locked --with pip-audit pip-audit

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check artifacts
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

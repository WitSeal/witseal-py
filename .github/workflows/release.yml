name: Release

# Builds and signs artifacts on a version tag, publishes a GitHub release,
# and publishes to PyPI via OIDC trusted publishing. The PyPI step runs in
# the `pypi` deployment environment (manual approval required), so
# distribution publication stays an explicitly authorized step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Version consistency (tag == pyproject == changelog)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_version_consistency.py
      - name: Test
        run: uv run pytest -q
      - name: Build wheel + sdist
        run: uv build
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          uvx cyclonedx-py environment > dist/witseal.cdx.json || \
            uvx --from cyclonedx-bom cyclonedx-py environment > dist/witseal.cdx.json
      - name: Checksums
        id: digests
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 * > SHA256SUMS
          echo "digests=$(base64 -w0 SHA256SUMS 2>/dev/null || base64 SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  sign:
    name: Sigstore sign
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts (keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz *.cdx.json SHA256SUMS; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.crt" "$f"
          done
      - name: Upload signed
        uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed
        uses: actions/download-artifact@v8
        with:
          name: signed
          path: dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sig
            dist/*.crt
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Artifacts are signed with Sigstore (Cosign keyless). Verify a file with:

            ```
            cosign verify-blob \
              --certificate <file>.crt \
              --signature <file>.sig \
              --certificate-identity "https://github.com/WitSeal/witseal-py/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              <file>
            ```

            Distribution to PyPI is handled by the gated publish-pypi job (OIDC trusted publishing).

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: [build, sign]
    runs-on: ubuntu-latest
    # Deployment environment gate: configure `pypi` with a required reviewer so
    # the first (and every) PyPI publish needs explicit manual approval.
    environment:
      name: pypi
      url: https://pypi.org/p/witseal
    permissions:
      id-token: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Keep only distributable artifacts
        run: |
          set -euo pipefail
          cd dist
          # PyPI accepts only the wheel and sdist; drop SBOM and checksums.
          find . -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -l
      - name: Publish to PyPI
        # No API token: authenticates via OIDC against the PyPI trusted
        # publisher configured for WitSeal/witseal-py (release.yml, env pypi).
        # Generates and uploads PEP 740 attestations (id-token: write).
        uses: pypa/gh-action-pypi-publish@release/v1
